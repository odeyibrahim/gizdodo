<!DOCTYPE html>
<html lang="en-NG">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin - GIZDODOSPECIALS</title>
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- LOGIN -->
  <div class="login-wrap" id="login-screen">
    <div class="login-card">
      <h1>GIZDODOSPECIALS</h1>
      <p class="sub">Admin Dashboard</p>
      <input type="password" id="login-password" placeholder="Enter admin password" aria-label="Admin password" autocomplete="current-password">
      <p class="login-error" id="login-error"></p>
      <button class="login-btn" onclick="handleLogin()">Sign In</button>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="dashboard">
    <header class="dash-header">
      <h1>GIZDODOSPECIALS Admin</h1>
      <button class="dash-logout" onclick="logout()">Sign Out</button>
    </header>

    <nav class="dash-tabs" aria-label="Dashboard sections">
      <button class="dash-tab active" data-tab="orders" onclick="switchTab('orders')">Orders</button>
      <button class="dash-tab" data-tab="images" onclick="switchTab('images')">Menu Images</button>
      <button class="dash-tab" data-tab="settings" onclick="switchTab('settings')">Settings</button>
    </nav>

    <div class="dash-content">

      <!-- Orders Panel -->
      <div class="dash-panel active" id="panel-orders">
        <div class="orders-table-wrap">
          <table class="orders-table">
            <thead>
              <tr>
                <th>Order #</th>
                <th>Customer</th>
                <th>Items</th>
                <th>Total</th>
                <th>Status / Date</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="orders-body">
              <tr><td colspan="6" class="empty-state">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Images Panel -->
      <div class="dash-panel" id="panel-images">
        <h2 style="font-size:18px;font-weight:700;margin-bottom:20px;">Product Images</h2>
        <p style="font-size:14px;color:var(--text-muted);margin-bottom:24px;">Upload images for each product and tier. Images are stored in Supabase Storage.</p>
        <div class="upload-grid" id="upload-grid"></div>
      </div>

      <!-- Settings Panel -->
      <div class="dash-panel" id="panel-settings">
        <div class="settings-card">
          <h3>Change Admin Password</h3>
          <label for="new-password">New Password</label>
          <input type="password" id="new-password" placeholder="Enter new password">
          <button class="btn-primary" onclick="changePassword()">Generate Hash</button>
          <label for="new-hash-output" style="margin-top:16px;">Password Hash (set as ADMIN_PASSWORD_HASH in Netlify)</label>
          <input type="text" id="new-hash-output" readonly placeholder="Hash will appear here" style="font-family:monospace;font-size:12px;">
        </div>
      </div>

    </div>
  </div>

  <script>
    // Env vars injected at build time by build.js
    // Placeholders are replaced with Netlify env var values.
    // To change: update env vars in Netlify Dashboard → Environment, then redeploy.
    window.ENV = {
      SUPABASE_URL: '__VITE_SUPABASE_URL__',
      SUPABASE_ANON_KEY: '__VITE_SUPABASE_ANON_KEY__',
      ADMIN_PASSWORD_HASH: '__VITE_ADMIN_PASSWORD_HASH__'
    };
  </script>
  <script src="admin.js"></script>
</body>
</html>
