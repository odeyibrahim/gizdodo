<!DOCTYPE html>
<html lang="en-NG">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - GIZDODOSPECIALS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #E8A317; --bg: #FFFBF5; --text: #2D1B00; --muted: #9C7A3C; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; text-align: center; }
    h1 { font-size: 48px; font-weight: 800; color: var(--primary); }
    p { font-size: 16px; color: var(--muted); margin: 12px 0 32px; }
    a { display: inline-block; padding: 12px 32px; background: var(--primary); color: #fff; font-weight: 700; border-radius: 9999px; text-decoration: none; transition: background 0.2s; }
    a:hover { background: #D4920F; }
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>Page not found. Let's get you back to the menu.</p>
    <a href="/">Back to Home</a>
  </div>
</body>
</html>
